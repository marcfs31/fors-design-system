name: Release

# Gated on CI, not on the push itself — `npm run release` only builds and
# publishes, it doesn't re-run lint/tests, so this must never fire on a red
# `main`. Runs after the "CI" workflow completes on `main`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write # dispatch CI + CodeQL on the version PR (see below)

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs the full history to diff changeset files against.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@marcfs31"

      - run: npm ci

      # If changesets are pending, opens/updates a "Version Packages" PR
      # (running `version-packages`). Once that PR is merged (so there are
      # no pending changesets left), runs `release` (build + `changeset
      # publish`) instead — publishing to GitHub Packages using the
      # workflow's own GITHUB_TOKEN (same-repo publish needs no separate
      # PAT/secret; see NODE_AUTH_TOKEN below) — and tags + creates a
      # GitHub Release for what it published.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The version PR is authored by github-actions[bot], which the repo's
      # workflow-approval policy ("first_time_contributors") treats as an
      # outside contributor: its pull_request runs are created but parked in
      # `action_required`, so the status checks `main` requires never report
      # and the PR can't merge. Approve those runs (same as the "Approve and
      # run" button) so the normal pull_request checks run against the bumped
      # state. Retries because the runs are created shortly after the push.
      - name: Approve the version PR's workflow runs
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            runs=$(gh run list --branch changeset-release/main --event pull_request \
              --status action_required --json databaseId --jq '.[].databaseId')
            if [ -n "$runs" ]; then
              for id in $runs; do
                echo "approving run $id"
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve"
              done
              exit 0
            fi
            sleep 10
          done
          echo "no parked pull_request runs found for changeset-release/main"
