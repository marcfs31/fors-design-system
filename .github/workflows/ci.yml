name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never writes to the repo — pin the token to read-only.
permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runtime floor stays Node >=18.18 (see package.json engines) — the
        # compiled dist runs there. The dev toolchain targets active LTS, so
        # CI verifies on 22 and 24. Raised from 20/22 on 2026-09-09: three
        # Dependabot majors landed the same week that all dropped Node 20
        # (jsdom@30, @changesets/cli@3, size-limit@13 — see CONTRIBUTING.md),
        # so pinning dev tooling below Node 22 had stopped being sustainable.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - run: npx size-limit
      - run: npm run test:package # publint + are-the-types-wrong on the built package

  audit:
    name: audit (npm audit, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # High/critical advisories anywhere in the tree block the merge — fix by
      # upgrading (or an `overrides` entry for a stuck transitive), never by
      # ignoring. Moderate/low ones arrive as Dependabot PRs instead.
      - run: npm audit --audit-level=high

  consumer:
    name: consumer (packed tarball in a Next.js + Tailwind v4 app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:consumer

  storybook:
    name: storybook (build + a11y/render test runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run test:storybook:ci
