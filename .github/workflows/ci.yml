name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runtime floor stays Node >=18.18 (see package.json engines) — the
        # compiled dist runs there. The dev toolchain (test-runner, attw,
        # concurrently) targets active LTS, so CI verifies on 20 and 22.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - run: npx size-limit
      - run: npm run test:package # publint + are-the-types-wrong on the built package

  storybook:
    name: storybook (build + a11y/render test runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run test:storybook:ci
