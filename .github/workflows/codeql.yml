name: CodeQL

# Static analysis for security *and* code quality (the `security-and-quality`
# suite adds maintainability/correctness queries to the default security set).
# Both "Analyze (…)" jobs are required status checks on `main`, so a new
# finding blocks the merge until it is fixed — not suppressed — see
# CONTRIBUTING.md "Security & code-quality policy".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 18 * * 1" # weekly, catches newly published queries/advisories

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions # the workflows in .github/workflows
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
